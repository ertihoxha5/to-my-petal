[project]
name = "tomypetal-ml"
version = "0.1.0"
description = "Dataset preparation, training and evaluation for the to my petal leaf classifier."
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "numpy>=2.2,<3",
    "pillow>=12.3,<13",
    "scikit-learn>=1.9,<1.10",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
